name: release

# Skeleton for npm trusted-publisher trust validation (staged publish only).
# The full release flow (tag triggers, gates, dry-runs) lands in Phase 13.5.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # v7.0.1 looked up 2026-10-28 via git ls-remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # v7.1.0 looked up 2026-10-28 via git ls-remote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm publish --provenance --access public
        working-directory: packages/codictator
