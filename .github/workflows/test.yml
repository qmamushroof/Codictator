name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filter: docs-only PRs skip the matrix and heavy gates (quick runs).
  # Lever 1: one-package PRs run the scoped suite; shared contract paths sit
  # in both filters so a CLI change selects full, as does `other`. Lever 2:
  # .github-only PRs run quick plus the smoke job, unless the matrix pair
  # itself changed (`workflows` forces the full gates).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      vscode: ${{ steps.filter.outputs.vscode }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
      workflows: ${{ steps.filter.outputs.workflows }}
      other: ${{ steps.filter.outputs.other }}
      suite: ${{ steps.suite.outputs.suite }}
    steps:
      # fetch-depth: 0 — kept: on push to main paths-filter diffs against the
      # pre-push commit via git (PR events use the API and ignore depth).
      # v7.0.1 looked up 2026-10-28 via git ls-remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # v4.0.3 looked up 2026-11-05 via git ls-remote.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            engine:
              - 'packages/codictator/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
            vscode:
              - 'packages/vscode/**'
              # Shared contract: the extension drives the engine CLI over
              # stdio, so CLI-surface changes force both suites.
              - 'packages/codictator/src/cli/**'
              - '**/setup-handoff*'
              - '**/serve-*.ts'
            docs:
              - 'docs/**'
              - '**/*.md'
            ci:
              - '.github/**'
            workflows:
              - '.github/workflows/test.yml'
              - '.github/workflows/test-heavy.yml'
            other:
              - 'custom-packs/**'
              - 'repo-missing-helper-tool/**'
              - '.codictator/**'
              - '.githooks/**'
              - 'AGENTS.md'
              - 'SECURITY.md'
              - 'biome.json'
              - 'tsconfig*.json'
              - '.gitattributes'
              - '.gitignore'
              - 'LICENSE'
      # One suite selector: unknown paths, both packages (shared contract), or workflow-pair edits select full.
      - id: suite
        env:
          ENGINE: ${{ steps.filter.outputs.engine }}
          VSCODE: ${{ steps.filter.outputs.vscode }}
          OTHER: ${{ steps.filter.outputs.other }}
          WORKFLOWS: ${{ steps.filter.outputs.workflows }}
        run: |
          suite=full
          if [ "$WORKFLOWS" != "true" ] && [ "$OTHER" != "true" ] && [ "$ENGINE" != "$VSCODE" ]; then
            if [ "$ENGINE" = "true" ]; then suite=engine; else suite=vscode; fi
          fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"

  # Merged static gate: typecheck + lint + build + a fast smoke of the
  # engine/extension stdio contract, once on Ubuntu instead of once per OS
  # in the matrix. The matrix needs this job, so a static failure fast-fails
  # before any 3-OS minutes burn; every PR still reports a build signal even
  # when the matrix is path-skipped.
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v7.0.1 looked up 2026-10-28 via git ls-remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # v7.1.0 looked up 2026-10-28 via git ls-remote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node --test packages/codictator/tests/unit/cli/serve-handshake.test.ts
      # Lever 3: share this single build with the matrix and the heavy jobs
      # instead of rebuilding per job. Keyed to the commit SHA so concurrent
      # runs never cross-read. Short-lived: only CI consumes it. Two
      # artifacts (one single path each): a multi-path artifact strips to
      # the least-common-ancestor (packages/), so consumers would land at
      # ./codictator/dist instead of ./packages/codictator/dist.
      # v7 looked up 2026-11-01 via git ls-remote.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-codictator-${{ github.sha }}
          path: packages/codictator/dist
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-vscode-${{ github.sha }}
          path: packages/vscode/dist
          if-no-files-found: error
          retention-days: 1

  test:
    needs: [changes, quick]
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.vscode == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.other == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # v7.0.1 looked up 2026-10-28 via git ls-remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # v7.1.0 looked up 2026-10-28 via git ls-remote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      # Lever 3: reuse quick's dist instead of rebuilding on every OS leg.
      # Single-path artifacts restore their directory contents, so each
      # downloads to its own packages/... path.
      # v8 looked up 2026-11-01 via git ls-remote.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-codictator-${{ github.sha }}
          path: packages/codictator/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-vscode-${{ github.sha }}
          path: packages/vscode/dist
      # Lever 1: one-package PRs run the ledger-aware suite for that package (same collect+evaluate as `npm test`); all else runs full.
      - if: needs.changes.outputs.suite == 'full'
        run: npm test
      - if: needs.changes.outputs.suite == 'engine' || needs.changes.outputs.suite == 'vscode'
        shell: bash
        run: |
          node --input-type=module --eval '
          import { discoverTestFiles, loadLedger, packagePaths } from "./packages/codictator/tests/support/red-ledger-collect.ts";
          import { collectOutcomesAsync, resolveJobCount, runTestFileAsync } from "./packages/codictator/tests/support/red-ledger-pool.ts";
          import { evaluateRun, formatRunReport } from "./packages/codictator/src/features/testing/index.ts";
          const name = "${{ needs.changes.outputs.suite }}" === "engine" ? "codictator" : "vscode";
          const pkg = packagePaths().find((p) => p.name === name);
          if (pkg === undefined) { console.error("unknown scope package"); process.exit(1); }
          collectOutcomesAsync(pkg, discoverTestFiles(pkg.testsDir), resolveJobCount([], process.env), runTestFileAsync).then((collected) => {
          const verdict = evaluateRun(loadLedger(pkg.testsDir, pkg.name).red, collected.outcomes);
          console.log([formatRunReport([{ packageName: pkg.name, verdict }]), ...collected.detailLines].join("\n"));
          process.exitCode = verdict.ok ? 0 : 1;
          }).catch((error) => { console.error(error); process.exitCode = 1; });
          '
      # SPEC §10.4: canonical verdict bytes per scenario for the cross-OS
      # compare job; always uploaded so a red run still leaves evidence.
      # v7 looked up 2026-11-01 via git ls-remote.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && needs.changes.outputs.suite != 'vscode'
        with:
          name: determinism-${{ matrix.os }}
          path: test-results/determinism/*.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && needs.changes.outputs.suite != 'vscode'
        with:
          name: stress-${{ matrix.os }}
          path: test-results/stress-timings.json
          if-no-files-found: warn
          retention-days: 7

  # Ubuntu-only heavy gates (coverage, packaging, ledger) live in the
  # test-heavy called workflow so this file stays under the file-size gate.
  # They fan out parallel to the 3-OS matrix instead of riding serially on
  # the ubuntu matrix leg, reuse quick's dist (Lever 3), and need quick so a
  # static failure fast-fails before these minutes burn.
  heavy-gates:
    needs: [changes, quick]
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.vscode == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.other == 'true'
    uses: ./.github/workflows/test-heavy.yml

  # Lever 2: .github-only PRs skip the matrix/heavy gates; quick plus this single-OS run is the signal.
  smoke:
    needs: [changes, quick]
    if: needs.changes.outputs.ci == 'true' && needs.changes.outputs.engine != 'true' && needs.changes.outputs.vscode != 'true' && needs.changes.outputs.other != 'true' && needs.changes.outputs.workflows != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # v7.0.1 looked up 2026-10-28 via git ls-remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # v7.1.0 looked up 2026-10-28 via git ls-remote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      # Same dist reuse as a matrix leg, single OS.
      # v8 looked up 2026-11-01 via git ls-remote.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-codictator-${{ github.sha }}
          path: packages/codictator/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-vscode-${{ github.sha }}
          path: packages/vscode/dist
      - run: npm test

  # SPEC §10.4: the CI matrix compares the Linux, Windows and macOS verdict
  # bytes of every determinism scenario, then re-runs the replay assertion.
  # The replay assertion imports only node: builtins and relative .ts sources
  # (Node 24 type-stripping), so there is nothing to install: no npm cache,
  # no npm ci. setup-node stays pinned for the toolchain version.
  determinism-compare:
    needs: [test, changes]
    if: needs.test.result == 'success' && needs.changes.outputs.suite != 'vscode'
    runs-on: ubuntu-latest
    steps:
      # v7.0.1 looked up 2026-10-28 via git ls-remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # v7.1.0 looked up 2026-10-28 via git ls-remote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # v8 looked up 2026-11-01 via git ls-remote.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: determinism-*
          path: determinism-compare
      - shell: bash
        run: |
          for file in determinism-compare/determinism-ubuntu-latest/*.json; do
            name="$(basename "$file")"
            cmp --silent "$file" "determinism-compare/determinism-windows-latest/$name"
            cmp --silent "$file" "determinism-compare/determinism-macos-latest/$name"
          done
          echo "determinism bytes identical across Linux, Windows and macOS"
      - run: node --test packages/codictator/tests/acceptance/replay/determinism.test.ts

  # Aggregator: always reports, even when the matrix is path-skipped (a
  # skipped required check still satisfies branch protection). Fails only
  # when an upstream job actually failed or was cancelled.
  required-checks:
    if: always()
    needs: [changes, quick, test, heavy-gates, determinism-compare, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fail on any upstream failure
        if: >-
          needs.changes.result == 'failure' || needs.changes.result == 'cancelled' ||
          needs.quick.result == 'failure' || needs.quick.result == 'cancelled' ||
          needs.test.result == 'failure' || needs.test.result == 'cancelled' ||
          needs.heavy-gates.result == 'failure' || needs.heavy-gates.result == 'cancelled' ||
          needs.smoke.result == 'failure' || needs.smoke.result == 'cancelled' ||
          needs.determinism-compare.result == 'failure' || needs.determinism-compare.result == 'cancelled'
        run: exit 1
