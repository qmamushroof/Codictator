name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filter: docs-only PRs skip the 3-OS matrix and the heavy gates
  # (quick still runs). Shared engine/extension contract paths sit in both the engine and
  # the vscode filter, so a CLI-surface change forces both suites; anything
  # outside the known groups is `other` and forces the full suite.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      vscode: ${{ steps.filter.outputs.vscode }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
      other: ${{ steps.filter.outputs.other }}
    steps:
      # fetch-depth: 0 — kept: on push to main paths-filter diffs against the
      # pre-push commit via git (PR events use the API and ignore depth).
      # v7.0.1 looked up 2026-10-28 via git ls-remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # v4.0.3 looked up 2026-11-05 via git ls-remote.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            engine:
              - 'packages/codictator/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
            vscode:
              - 'packages/vscode/**'
              # Shared contract: the extension drives the engine CLI over
              # stdio, so CLI-surface changes force both suites.
              - 'packages/codictator/src/cli/**'
              - '**/setup-handoff*'
              - '**/serve-*.ts'
            docs:
              - 'docs/**'
              - '**/*.md'
            ci:
              - '.github/**'
            other:
              - 'custom-packs/**'
              - 'repo-missing-helper-tool/**'
              - '.codictator/**'
              - '.githooks/**'
              - 'AGENTS.md'
              - 'SECURITY.md'
              - 'biome.json'
              - 'tsconfig*.json'
              - '.gitattributes'
              - '.gitignore'
              - 'LICENSE'

  # Merged static gate: typecheck + lint + build + a fast smoke of the
  # engine/extension stdio contract, once on Ubuntu instead of once per OS
  # in the matrix. The matrix needs this job, so a static failure fast-fails
  # before any 3-OS minutes burn; every PR still reports a build signal even
  # when the matrix is path-skipped.
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v7.0.1 looked up 2026-10-28 via git ls-remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # v7.1.0 looked up 2026-10-28 via git ls-remote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node --test packages/codictator/tests/unit/cli/serve-handshake.test.ts
      # Lever 3: share this single build with the matrix and the heavy jobs
      # instead of rebuilding per job. Keyed to the commit SHA so concurrent
      # runs never cross-read. Short-lived: only CI consumes it. Two
      # artifacts (one single path each): a multi-path artifact strips to
      # the least-common-ancestor (packages/), so consumers would land at
      # ./codictator/dist instead of ./packages/codictator/dist.
      # v7 looked up 2026-11-01 via git ls-remote.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-codictator-${{ github.sha }}
          path: packages/codictator/dist
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-vscode-${{ github.sha }}
          path: packages/vscode/dist
          if-no-files-found: error
          retention-days: 1

  test:
    needs: [changes, quick]
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.vscode == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.other == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # v7.0.1 looked up 2026-10-28 via git ls-remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # v7.1.0 looked up 2026-10-28 via git ls-remote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      # Lever 3: reuse quick's dist instead of rebuilding on every OS leg.
      # Single-path artifacts restore their directory contents, so each
      # downloads to its own packages/... path.
      # v8 looked up 2026-11-01 via git ls-remote.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-codictator-${{ github.sha }}
          path: packages/codictator/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-vscode-${{ github.sha }}
          path: packages/vscode/dist
      - run: npm test
      # SPEC §10.4: canonical verdict bytes per scenario for the cross-OS
      # compare job; always uploaded so a red run still leaves evidence.
      # v7 looked up 2026-11-01 via git ls-remote.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: determinism-${{ matrix.os }}
          path: test-results/determinism/*.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: stress-${{ matrix.os }}
          path: test-results/stress-timings.json
          if-no-files-found: warn
          retention-days: 7

  # Ubuntu-only heavy gates (coverage, packaging, ledger) live in the
  # test-heavy called workflow so this file stays under the file-size gate.
  # They fan out parallel to the 3-OS matrix instead of riding serially on
  # the ubuntu matrix leg, reuse quick's dist (Lever 3), and need quick so a
  # static failure fast-fails before these minutes burn.
  heavy-gates:
    needs: [changes, quick]
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.vscode == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.other == 'true'
    uses: ./.github/workflows/test-heavy.yml

  # SPEC §10.4: the CI matrix compares the Linux, Windows and macOS verdict
  # bytes of every determinism scenario, then re-runs the replay assertion.
  # The replay assertion imports only node: builtins and relative .ts sources
  # (Node 24 type-stripping), so there is nothing to install: no npm cache,
  # no npm ci. setup-node stays pinned for the toolchain version.
  determinism-compare:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # v7.0.1 looked up 2026-10-28 via git ls-remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # v7.1.0 looked up 2026-10-28 via git ls-remote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # v8 looked up 2026-11-01 via git ls-remote.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: determinism-*
          path: determinism-compare
      - shell: bash
        run: |
          for file in determinism-compare/determinism-ubuntu-latest/*.json; do
            name="$(basename "$file")"
            cmp --silent "$file" "determinism-compare/determinism-windows-latest/$name"
            cmp --silent "$file" "determinism-compare/determinism-macos-latest/$name"
          done
          echo "determinism bytes identical across Linux, Windows and macOS"
      - run: node --test packages/codictator/tests/acceptance/replay/determinism.test.ts

  # Aggregator: always reports, even when the matrix is path-skipped (a
  # skipped required check still satisfies branch protection). Fails only
  # when an upstream job actually failed or was cancelled.
  required-checks:
    if: always()
    needs: [changes, quick, test, heavy-gates, determinism-compare]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fail on any upstream failure
        if: >-
          needs.changes.result == 'failure' || needs.changes.result == 'cancelled' ||
          needs.quick.result == 'failure' || needs.quick.result == 'cancelled' ||
          needs.test.result == 'failure' || needs.test.result == 'cancelled' ||
          needs.heavy-gates.result == 'failure' || needs.heavy-gates.result == 'cancelled' ||
          needs.determinism-compare.result == 'failure' || needs.determinism-compare.result == 'cancelled'
        run: exit 1
