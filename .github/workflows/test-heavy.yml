name: test-heavy

# Called by the test workflow's heavy-gates job. Holds the Ubuntu-only
# heavy gates fanned out parallel to the 3-OS matrix (Lever 5): the coverage
# suite, the packaging check, and the ledger gates overlap instead of
# queueing serially. Each gate reuses quick's dist (Lever 3) instead of
# rebuilding. The path-filter gate lives at the call site; every job here
# runs once the caller lets it through.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  heavy-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # v7.0.1 looked up 2026-10-28 via git ls-remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # v7.1.0 looked up 2026-10-28 via git ls-remote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      # v8 looked up 2026-11-01 via git ls-remote.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-${{ github.sha }}
          path: .
      # SPEC §10.6 thresholds are enforced by the test:coverage flags; the run
      # itself exits 1 while red-ledger entries remain, so only a threshold
      # breach or a crash fails this step. `npm test` in the matrix gates real
      # failures, which it reports strictly.
      - shell: bash
        run: |
          set +e
          output="$(npm run test:coverage 2>&1)"
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then exit "$status"; fi
          printf '%s' "$output" | node -e 'let s = ""; process.stdin.on("data", (c) => { s += c; }).on("end", () => { const m = /all files\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)/.exec(s); if (/does not meet threshold/.test(s) || m === null || Number(m[1]) < 90 || Number(m[2]) < 80) { process.exit(1); } })'

  heavy-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # v7.0.1 looked up 2026-10-28 via git ls-remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # v7.1.0 looked up 2026-10-28 via git ls-remote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      # v8 looked up 2026-11-01 via git ls-remote.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-${{ github.sha }}
          path: .
      # Single build reused: the packaging check runs against quick's dist
      # instead of rebuilding via test:packaging.
      - run: npm pack --dry-run -w codictator && node --test packages/codictator/tests/acceptance/packaging/packaging.test.ts

  heavy-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # fetch-depth: 0 — the PR-only red-ledger --base step below needs the
      # base SHA present in the clone; this is the only job that keeps full
      # history.
      # v7.0.1 looked up 2026-10-28 via git ls-remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # v7.1.0 looked up 2026-10-28 via git ls-remote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      # v8 looked up 2026-11-01 via git ls-remote.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-${{ github.sha }}
          path: .
      # SPEC 10.7 query exits 1 while red entries remain; the gates are
      # npm test and the base comparison below, so only real errors fail here.
      - shell: bash
        run: |
          set +e
          npm run ledger -- --covers §10.3
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then exit "$status"; fi
      # SPEC §10.7 Adding rule: a test that existed at the base must not
      # become listed. PR-only: the base SHA exists only on pull_request.
      - if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            echo "no base revision to compare against; skipping"
            exit 0
          fi
          node packages/codictator/tests/support/red-ledger-runner.ts --base "$BASE"
